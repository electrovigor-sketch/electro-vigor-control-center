<style>

(0,1fr));gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:0 3px 12px #1e47700a;min-width:0}.stat{border-top:4px solid var(--blue2)}.stat .n{font-size:25px;font-weight:bold;overflow-wrap:anywhere}.stat .label{font-size:12px;color:var(--muted)}.card h3{margin:0 0 10px;font-size:16px}.section{margin-bottom:14px}.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.field label{font-size:12px;color:#53677d}.field input,.field textarea,.field select,input,textarea,select{width:100%;padding:10px;border:1px solid #d7e1eb;border-radius:9px;background:white;color:var(--ink)}textarea{min-height:92px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{background:#f5f9fd;color:#52677b}.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;background:#e9f4ff;color:#0756a5}.pill.done{background:#e2f7ec;color:#087443}.pill.warn{background:#fff3d8;color:#8c5d00}.step-card{display:flex;gap:12px;align-items:flex-start}.step-no{flex:0 0 40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#0756a5,#13a76b);color:white;display:grid;place-items:center;font-weight:bold}.step-card h3{margin:0}.step-card p{margin:3px 0 8px}.step-card .btn{margin-top:5px}.progress{height:8px;background:#e8eef4;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue2),var(--green));width:0}.task{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.task input{width:auto}.hidden{display:none!important}.invoice-items input{min-width:70px}.invoice-preview{background:white;border:1px solid #dce5ed;border-radius:12px;padding:22px}.logo <body><div class="app">
<header class="top"><div class="brand"><img src="electro-vigor-logo.jpg" alt="لوگوی الکترو ویگور"><div><h1>مرکز کنترل الکترو ویگور</h1><p>سیستم یکپارچه اجرا، مدیریت و رشد کسب‌وکار</p></div></div><div class="top-actions"><button class="btn light" onclick="showPage('dashboard')">داشبورد</button><button class="btn light" onclick="exportBackup()">پشتیبان‌گیری</button><button class="btn light" onclick="document.getElementById('restoreFile').click()">بازیابی اطلاعات</button><input id="restoreFile" type="file" accept="application/json" class="hidden" onchange="restoreBackup(event)"></div></header>
<div class="layout"><nav class="nav" id="nav"><div class="group">مرکز مدیریت</div><button data-page="dashboard" class="active">▦ داشبورد</button><button data-page="roadmap">◉ نقشه‌راه ۱۵ استپی</button><button data-page="invoices">▤ فاکتور من</button><button data-page="data">▥ مرکز داده رشد</button><button data-page="channels">⌁ عملکرد کانال‌ها</button><button data-page="kpis">◎ شاخص‌ها و اهداف</button><button data-page="decisions">↻ چرخه تصمیم‌گیری</button><div class="group">مدیریت کسب‌وکار</div><button data-page="sales">▣ فروش و مشتریان</button><button data-page="products">▧ محصولات و موجودی</button><button data-page="content">▤ محتوا و انتشار</button><button data-page="finance">₮ مالی و هزینه‌ها</button><button data-page="settings">⚙ تنظیمات کسب‌وکار</button></nav><main class="main" id="main"></main></div><div class="footer">الکترو ویگور · اطلاعات این نسخه روی همین مرورگر ذخیره می‌شود؛ مرتب پشتیبان بگیرید.</div></div>
<script>
const steps=[
['هویت و جایگاه برند','Brand & Positioning','مأموریت، چشم‌انداز، ارزش‌ها، مخاطب هدف، شخصیت و پیام برند، هویت بصری و راهنمای برند.','سند هویت و جایگاه برند'],
['اکوسیستم کسب‌وکار','Business Ecosystem','مدل درآمدی، زنجیره تأمین، شرکا، منابع، خدمات، مزیت رقابتی و ارتباط بین کسب‌وکارها.','نقشه مدل کسب‌وکار'],
['وب‌سایت و تجربه خرید','Website & UX','ساختار سایت، صفحات، دسته‌بندی‌ها، تجربه موبایل، سرعت، اعتماد، پرداخت، سفارش و نرخ تبدیل.','چک‌لیست بهبود سایت'],
['اینستاگرام','Instagram','پروفایل، ستون‌های محتوا، ریلز، استوری، تعامل، پیام‌های مشتری و مسیر تبدیل به فروش.','برنامه و گزارش اینستاگرام'],
['یوتیوب','YouTube','موضوع کانال، ویدئوی آموزشی، عنوان و کاور، سئو ویدئو، نگهداشت مخاطب و هدایت به سایت.','برنامه رشد یوتیوب'],
['تلگرام','Telegram','کانال، محتوای کاربردی، دسته‌بندی پیام‌ها، پیوند به محصولات، جامعه مخاطبان و سنجش کلیک.','برنامه تلگرام'],
['بله','Bale','ساختار کانال، بازنشر بومی‌شده، پیام‌های فروش، پرسش و پاسخ و سنجش واکنش مخاطب.','برنامه بله'],
['روبیکا','Rubika','پروفایل، قالب انتشار، محتوای متناسب پلتفرم، تعامل و سنجش ورودی و فروش.','برنامه روبیکا'],
['ایتا','Eitaa','کانال، تقویم انتشار، محتوای آموزشی و فروش، لینک‌های رهگیری و مدیریت تعامل.','برنامه ایتا'],
['لینکدین','LinkedIn','اعتبار تخصصی، تجربه‌های فنی، محتوای B2B، ارتباط با تأمین‌کنندگان و مشتریان حرفه‌ای.','برنامه لینکدین'],
['گوگل و سئو','Google & SEO','تحقیق کلمات کلیدی، صفحات دسته و محصول، محتوای راهنما، ایندکس، لینک‌سازی و سرچ کنسول.','برنامه سئو و گزارش فنی'],
['استراتژی محتوا','Content Strategy','پرسونا، محتوای مادر، سناریو، بازتولید چندکاناله، تقویم، فراخوان اقدام و آرشیو محتوا.','تقویم محتوایی و بانک محتوا'],
['بازاریابی','Marketing','پیشنهاد فروش، کمپین، بودجه، کانال جذب، هزینه جذب مشتری، آزمایش پیام و بازگشت هزینه.','برنامه بازاریابی و نتایج'],
['سیستم فروش','Sales System','مسیر مشتری، ثبت سرنخ، پیگیری، پیشنهاد قیمت، فاکتور، تبدیل، خرید مجدد و خدمات پس از فروش.','فرایند فروش قابل تکرار'],
['تحلیل و رشد','Analytics & Growth','مرکز داده رشد، سنجش کانال‌ها، شاخص‌ها و اهداف، گزارش مدیریتی، آزمایش و چرخه تصمیم‌گیری.','داشبورد رشد و چرخه بهینه‌سازی']];
const defaultState={business:{name:'الکترو ویگور',phone:'',email:'',address:'',website:'electrovigor.ir',taxId:'',currency:'تومان',invoicePrefix:'EV'},steps:steps.map((s,i)=>({status:'شروع نشده',owner:'',due:'',notes:'',tasks:[],output:'',score:0})),invoices:[],channels:[{name:'وب‌سایت',visits:0,leads:0,sales:0,cost:0},{name:'ترب',visits:0,leads:0,sales:0,cost:0},{name:'اینستاگرام',visits:0,leads:0,sales:0,cost:0},{name:'تلگرام',visits:0,leads:0,sales:0,cost:0},{name:'یوتیوب',visits:0,leads:0,sales:0,cost:0},{name:'بله',visits:0,leads:0,sales:0,cost:0},{name:'روبیکا',visits:0,leads:0,sales:0,cost:0},{name:'ایتا',visits:0,leads:0,sales:0,cost:0},{name:'لینکدین',visits:0,leads:0,sales:0,cost:0}],kpis:[],decisions:[],sales:[],products:[],content:[],expenses:[],monthlyGoal:100000000};
let state;try{state=JSON.parse(localStorage.getItem('ev-control-v2'))||structuredClone(defaultState)}catch(e){state=JSON.parse(JSON.stringify(defaultState))}function save(){localStorage.setItem('ev-control-v2',JSON.stringify(state));}
let currentPage='dashboard';const main=document.getElementById('main');const fmt=n=>Number(n||0).toLocaleString('fa-IR');const num=v=>Number(String(v||0).replace(/[٬,]/g,''))||0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showPage(p){currentPage=p;document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('#nav button[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
function title(t,sub='',actions=''){return `<div class="page-title"><div><h2>${t}</h2>${sub?`<div class="muted">${sub}</div>`:''}</div><div class="row no-print" style="flex:0 1 auto">${actions}</div></div>`}function card(t,body){return `<section class="card section"><h3>${t}</h3>${body}</section>`}function field(label,key,value='',type='text',placeholder=''){return `<div class="field"><label>${label}</label><input type="${type}" data-key="${key}" value="${esc(value)}" placeholder="${placeholder}"></div>`}function area(label,key,value='',placeholder=''){return `<div class="field"><label>${label}</label><textarea data-key="${key}" placeholder="${placeholder}">${esc(value)}</textarea></div>`}function stat(label,value,detail=''){return `<div class="card stat"><div class="label">${label}</div><div class="n">${value}</div><div class="muted">${detail}</div></div>`}
function render(){if(currentPage==='dashboard')renderDashboard();else if(currentPage==='roadmap')renderRoadmap();else if(currentPage==='step')renderStep(window.activeStep);else if(currentPage==='invoices')renderInvoices();else if(currentPage==='invoice-edit')renderInvoiceEdit();else if(currentPage==='data')renderData();else if(currentPage==='channels')renderChannels();else if(currentPage==='kpis')renderKpis();else if(currentPage==='decisions')renderDecisions();else if(currentPage==='sales')renderSales();else if(currentPage==='products')renderProducts();else if(currentPage==='content')renderContent();else if(currentPage==='finance')renderFinance();else if(currentPage==='settings')renderSettings()}
function renderDashboard(){let done=state.steps.filter(s=>s.status==='تکمیل شده').length,doing=state.steps.filter(s=>s.status==='در حال اجرا').length,invTotal=state.invoices.reduce((a,i)=>a+Number(i.total||0),0),sales=state.sales.reduce((a,s)=>a+num(s.amount),0),expenses=state.expenses.reduce((a,e)=>a+num(e.amount),0);main.innerHTML=title('داشبورد مدیریتی','نمای کلی پروژه، فروش و رشد')+`<div class="grid">${stat('استپ‌های تکمیل‌شده',fmt(done)+' از ۱۵',`${fmt(doing)} استپ در حال اجرا`)}${stat('فاکتورهای ثبت‌شده',fmt(state.invoices.length),'مجموع فاکتورها: '+fmt(invTotal)+' تومان')}${stat('فروش ثبت‌شده',fmt(sales)+' تومان','بر اساس داده‌های واردشده')}${stat('سود/زیان ثبت ساده',fmt(sales-expenses)+' تومان','فروش منهای هزینه‌های ثبت‌شده')}</div><div class="grid two" style="margin-top:12px">${card('پیشرفت نقشه‌راه',`<div class="progress"><span style="width:${done/15*100}%"></span></div><p class="muted">${fmt(Math.round(done/15*100))}٪ تکمیل بر اساس استپ‌های تأییدشده</p><button class="btn secondary" onclick="showPage('roadmap')">رفتن به نقشه‌راه</button>`)}${card('دسترسی سریع',`<div class="row"><button class="btn" onclick="newInvoice()">＋ صدور فاکتور</button><button class="btn secondary" onclick="showPage('data')">مرکز داده رشد</button><button class="btn secondary" onclick="showPage('decisions')">ثبت تصمیم جدید</button></div><p class="muted">اعداد تا زمانی که اطلاعات وارد نکنی، واقعی نیستند یا صفر نمایش داده می‌شوند.</p>`)}</div>${card('کارهای در جریان',state.steps.map((s,i)=>s.status==='در حال اجرا'?`<div class="task"><span class="pill warn">استپ ${i+1}</span><span style="flex:1">${steps[i][0]}</span><button class="btn small secondary" onclick="openStep(${i})">بازکردن</button></div>`:'').join('')||'<p class="muted">هنوز استپی به‌عنوان «در حال اجرا» ثبت نشده است.</p>')}`}
function renderRoadmap(){main.innerHTML=title('نقشه‌راه ۱۵ استپی','هر استپ شامل راهنما، ابزار اجرا، وظایف، خروجی و شاخص‌های مرتبط است.')+`<div class="grid two">${steps.map((s,i)=>{let d=state.steps[i],cls=d.status==='تکمیل شده'?'done':d.status==='در حال اجرا'?'warn':'';return `<div class="card step-card"><div class="step-no">${i+1}</div><div style="flex:1;min-width:0"><h3>${s[0]}</h3><div class="muted">${s[1]}</div><p class="muted">${s[2]}</p><span class="pill ${cls}">${d.status}</span> <span class="muted">${d.tasks.filter(t=>t.done).length}/${d.tasks.length} وظیفه</span><br><button class="btn secondary small" onclick="openStep(${i})">ورود به استپ ←</button></div></div>`}).join('')}</div>`}
function openStep(i){window.activeStep=i;currentPage='step';render()}
function renderStep(i){if(i==null)i=0;let s=steps[i],d=state.steps[i];main.innerHTML=title(`استپ ${i+1} — ${s[0]}`,s[1],`<button class="btn secondary" onclick="showPage('roadmap')">بازگشت به نقشه‌راه</button>`)+card('هدف و خروجی استپ',`<p>${s[2]}</p><div class="field"><label>خروجی نهایی مورد انتظار</label><input id="stepOutput" value="${esc(d.output||s[3])}"></div><div class="row"><div class="field"><label>وضعیت</label><select id="stepStatus">${['شروع نشده','در حال اجرا','متوقف','تکمیل شده'].map(x=>`<option ${d.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>مسئول</label><input id="stepOwner" value="${esc(d.owner)}" placeholder="نام یا نقش مسئول"></div><div class="field"><label>مهلت</label><input id="stepDue" type="date" value="${esc(d.due)}"></div></div><div class="field"><label>یادداشت‌ها و تصمیم‌های مربوط به استپ</label><textarea id="stepNotes" placeholder="اطلاعات تأییدشده، ایده‌ها، موانع و موارد نیازمند پیگیری">${esc(d.notes)}</textarea></div><button class="btn" onclick="saveStep(${i})">ذخیره تغییرات استپ</button>`)+card('وظایف اجرایی',`<div id="tasksList">${d.tasks.map((t,j)=>`<div class="task"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i},${j},this.checked)"><span style="flex:1;${t.done?'text-decoration:line-through;color:#8390a0':''}">${esc(t.text)}</span><button class="btn red small" onclick="deleteTask(${i},${j})">حذف</button></div>`).join('')||'<p class="muted">هنوز وظیفه‌ای ثبت نشده.</p>'}</div><div class="row"><input id="newTaskText" placeholder="وظیفه جدید این استپ را بنویس..."><button class="btn green" style="flex:0 0 auto" onclick="addTask(${i})">افزودن وظیفه</button></div>`)+card('ابزارها و شاخص‌های مرتبط',`<p class="muted">برای استپ ۱۵ از مرکز داده رشد، عملکرد کانال‌ها، شاخص‌ها و اهداف و چرخه تصمیم‌گیری استفاده کن. سایر استپ‌ها نیز از طریق یادداشت‌ها، وظایف و خروجی‌های قابل ثبت مدیریت می‌شوند. در توسعه‌های بعدی، فرم‌های تخصصی هر استپ به این ماژول متصل خواهند شد.</p><div class="row"><button class="btn secondary" onclick="showPage('kpis')">شاخص‌ها و اهداف</button><button class="btn secondary" onclick="showPage('data')">مرکز داده رشد</button><button class="btn secondary" onclick="showPage('decisions')">تصمیم‌گیری و رشد</button></div>`)}
function saveStep(i){let d=state.steps[i];d.status=document.getElementById('stepStatus').value;d.owner=document.getElementById('stepOwner').value;d.due=document.getElementById('stepDue').value;d.notes=document.getElementById('stepNotes').value;d.output=document.getElementById('stepOutput').value;save();render();}function addTask(i){let el=document.getElementById('newTaskText');if(el.value.trim()){state.steps[i].tasks.push({text:el.value.trim(),done:false});save();render()}}function toggleTask(i,j,v){state.steps[i].tasks[j].done=v;save();render()}function deleteTask(i,j){state.steps[i].tasks.splice(j,1);save();render()}
function renderInvoices(){main.innerHTML=title('فاکتور من','ساخت، نگهداری و چاپ فاکتور مشتری',`<button class="btn green" onclick="newInvoice()">＋ فاکتور جدید</button>`)+`<div class="notice section">فاکتور از اطلاعاتی که وارد می‌کنی ساخته می‌شود. خروجی چاپ را می‌توانی از پنجره چاپ گوشی به‌صورت PDF ذخیره یا چاپ کنی. اطلاعات فعلاً فقط در همین مرورگر ذخیره می‌شوند.</div>`+card('فاکتورهای ثبت‌شده',state.invoices.length?`<div class="table-wrap"><table><thead><tr><th>شماره</th><th>تاریخ</th><th>مشتری</th><th>مبلغ نهایی</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>${state.invoices.map((x,i)=>`<tr><td>${esc(x.number)}</td><td>${esc(x.date)}</td><td>${esc(x.customer||'—')}</td><td>${fmt(x.total)} تومان</td><td>${esc(x.status||'صادر شده')}</td><td><button class="btn small secondary" onclick="editInvoice(${i})">ویرایش</button> <button class="btn small" onclick="printInvoice(${i})">چاپ / PDF</button> <button class="btn small red" onclick="deleteInvoice(${i})">حذف</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">هنوز فاکتوری ثبت نشده است. برای شروع روی «فاکتور جدید» بزن.</p>')}
let editingInvoice=-1;function newInvoice(){editingInvoice=-1;window.invoiceDraft={number:(state.business.invoicePrefix||'EV')+'-'+String(state.invoices.length+1).padStart(4,'0'),date:new Date().toISOString().slice(0,10),customer:'',phone:'',address:'',description:'',discount:0,paid:0,status:'صادر شده',items:[{name:'',qty:1,price:0}],notes:''};showPage('invoice-edit')}function editInvoice(i){editingInvoice=i;window.invoiceDraft=JSON.parse(JSON.stringify(state.invoices[i]));showPage('invoice-edit')}
function calcInvoice(){let d=window.invoiceDraft;d.subtotal=d.items.reduce((a,x)=>a+num(x.qty)*num(x.price),0);d.total=Math.max(0,d.subtotal-num(d.discount));d.remaining=Math.max(0,d.total-num(d.paid));}
function renderInvoiceEdit(){let d=window.invoiceDraft;calcInvoice();main.innerHTML=title(editingInvoice<0?'صدور فاکتور جدید':'ویرایش فاکتور', 'اطلاعات را کامل کن و سپس ذخیره یا چاپ بگیر.',`<button class="btn secondary" onclick="showPage('invoices')">بازگشت</button>`)+card('اطلاعات فروشنده',`<div class="row"><div><strong>${esc(state.business.name||'الکترو ویگور')}</strong><div class="muted">${esc(state.business.website||'')}</div><div class="muted">${esc(state.business.phone||'')}</div></div><div class="field"><label>شماره فاکتور</label><input id="invNumber" value="${esc(d.number)}"></div><div class="field"><label>تاریخ فاکتور</label><input id="invDate" type="date" value="${esc(d.date)}"></div></div>`)+card('اطلاعات مشتری',`<div class="row"><div class="field"><label>نام مشتری</label><input id="invCustomer" value="${esc(d.customer)}" placeholder="نام شخص یا شرکت"></div><div class="field"><label>شماره تماس</label><input id="invPhone" value="${esc(d.phone)}"></div></div><div class="field"><label>آدرس مشتری</label><input id="invAddress" value="${esc(d.address)}"></div>`)+card('اقلام فاکتور',`<div class="table-wrap"><table class="invoice-items"><thead><tr><th>شرح کالا / خدمات</th><th>تعداد</th><th>قیمت واحد (تومان)</th><th>جمع</th><th></th></tr></thead><tbody id="invoiceRows">${d.items.map((x,i)=>`<tr><td><input value="${esc(x.name)}" placeholder="نام کالا یا خدمت" onchange="updateItem(${i},'name',this.value)"></td><td><input type="number" min="0" value="${num(x.qty)}" onchange="updateItem(${i},'qty',this.value)"></td><td><input type="number" min="0" value="${num(x.price)}" onchange="updateItem(${i},'price',this.value)"></td><td>${fmt(num(x.qty)*num(x.price))}</td><td><button class="btn red small" onclick="removeItem(${i})">×</button></td></tr>`).join('')}</tbody></table></div><button class="btn secondary small" onclick="addItem()">＋ افزودن ردیف</button><div class="row" style="margin-top:12px"><div class="field"><label>تخفیف (تومان)</label><input id="invDiscount" type="number" min="0" value="${num(d.discount)}" onchange="updateDraft('discount',this.value)"></div><div class="field"><label>مبلغ پرداخت‌شده (تومان)</label><input id="invPaid" type="number" min="0" value="${num(d.paid)}" onchange="updateDraft('paid',this.value)"></div></div><div class="grid three"><div class="card"><div class="muted">جمع اقلام</div><strong id="invSubtotal">${fmt(d.subtotal)} تومان</strong></div><div class="card"><div class="muted">مبلغ نهایی</div><strong id="invTotal">${fmt(d.total)} تومان</strong></div><div class="card"><div class="muted">مانده</div><strong id="invRemaining">${fmt(d.remaining)} تومان</strong></div></div>`)+card('توضیحات و شرایط',`<div class="field"><label>توضیحات فاکتور</label><textarea id="invDescription">${esc(d.description)}</textarea></div><div class="field"><label>یادداشت / شرایط پرداخت</label><textarea id="invNotes">${esc(d.notes)}</textarea></div><div class="field"><label>وضعیت</label><select id="invStatus">${['پیش‌نویس','صادر شده','پرداخت‌شده','لغو شده'].map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="row"><button class="btn green" onclick="saveInvoice()">ذخیره فاکتور</button><button class="btn" onclick="saveAndPrintInvoice()">ذخیره و چاپ / PDF</button></div>`)}
function updateItem(i,k,v){window.invoiceDraft.items[i][k]=k==='name'?v:num(v);calcInvoice();}function addItem(){window.invoiceDraft.items.push({name:'',qty:1,price:0});renderInvoiceEdit()}function removeItem(i){window.invoiceDraft.items.splice(i,1);if(!window.invoiceDraft.items.length)window.invoiceDraft.items.push({name:'',qty:1,price:0});renderInvoiceEdit()}function updateDraft(k,v){window.invoiceDraft[k]=num(v);calcInvoice();['invSubtotal','invTotal','invRemaining'].forEach((id,j)=>{let el=document.getElementById(id);if(el)el.textContent=fmt([window.invoiceDraft.subtotal,window.invoiceDraft.total,window.invoiceDraft.remaining][j])+' تومان'})}
function collectInvoice(){let d=window.invoiceDraft;d.number=document.getElementById('invNumber').value;d.date=document.getElementById('invDate').value;d.customer=document.getElementById('invCustomer').value;d.phone=document.getElementById('invPhone').value;d.address=document.getElementById('invAddress').value;d.discount=num(document.getElementById('invDiscount').value);d.paid=num(document.getElementById('invPaid').value);d.description=document.getElementById('invDescription').value;d.notes=document.getElementById('invNotes').value;d.status=document.getElementById('invStatus').value;calcInvoice();return d}function saveInvoice(){let d=collectInvoice();if(editingInvoice<0){state.invoices.unshift(JSON.parse(JSON.stringify(d)));editingInvoice=0}else state.invoices[editingInvoice]=JSON.parse(JSON.stringify(d));save();showPage('invoices')}function saveAndPrintInvoice(){let d=collectInvoice();if(editingInvoice<0){state.invoices.unshift(JSON.parse(JSON.stringify(d)));editingInvoice=0}else state.invoices[editingInvoice]=JSON.parse(JSON.stringify(d));save();printInvoice(editingInvoice)}function deleteInvoice(i){if(confirm('این فاکتور حذف شود؟')){state.invoices.splice(i,1);save();renderInvoices()}}
function printInvoice(i){let d=state.invoices[i];if(!d)return;let w=window.open('','_blank');if(!w){alert('مرورگر اجازه بازشدن پنجره چاپ را نداد. اجازه pop-up را فعال کن و دوباره امتحان کن.');return}let rows=d.items.map((x,j)=>`<tr><td>${j+1}</td><td>${esc(x.name)}</td><td>${fmt(x.qty)}</td><td>${fmt(x.price)}</td><td>${fmt(num(x.qty)*num(x.price))}</td></tr>`).join('');w.document.write(`<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><title>فاکتور ${esc(d.number)}</title><style>body{font-family:Tahoma,sans-serif;padding:28px;color:#15283c}header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #0b6caf;padding-bottom:15px}img{width:150px;max-height:95px;object-fit:contain}h1{font-size:22px;color:#0756a5}table{width:100%;border-collapse:collapse;margin-top:25px}th,td{border:1px solid #ccd8e4;padding:10px;text-align:right}th{background:#eaf4ff}.totals{width:320px;margin:20px 0 0 auto}.totals p{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:5px}.note{margin-top:25px;white-space:pre-wrap}.sign{display:flex;justify-content:space-between;margin-top:60px}.muted{color:#66768a;font-size:12px}@media print{button{display:none}}</style><header><div><h1>فاکتور فروش</h1><b>${esc(state.business.name)}</b><p>${esc(state.business.website)}<br>${esc(state.business.phone)}<br>${esc(state.business.address)}</p></div><img src="${new URL('electro-vigor-logo.jpg',location.href).href}"><div><b>شماره: ${esc(d.number)}</b><p>تاریخ: ${esc(d.date)}</p></div></header><h3>مشخصات مشتری</h3><p>نام: ${esc(d.customer||'—')}　 تلفن: ${esc(d.phone||'—')}<br>آدرس: ${esc(d.address||'—')}</p><table><thead><tr><th>ردیف</th><th>شرح کالا / خدمات</th><th>تعداد</th><th>قیمت واحد (تومان)</th><th>مبلغ (تومان)</th></tr></thead><tbody>${rows}</tbody></table><div class="totals"><p><span>جمع اقلام</span><b>${fmt(d.subtotal)} تومان</b></p><p><span>تخفیف</span><b>${fmt(d.discount)} تومان</b></p><p><span>مبلغ نهایی</span><b>${fmt(d.total)} تومان</b></p><p><span>پرداخت‌شده</span><b>${fmt(d.paid)} تومان</b></p><p><span>مانده</span><b>${fmt(d.remaining)} تومان</b></p></div><div class="note">${esc(d.description||'')}${d.notes?'\n'+esc(d.notes):''}</div><div class="sign"><span>مهر و امضای فروشنده</span><span>امضای مشتری</span></div><p class="muted">این فاکتور توسط سیستم اجرایی الکترو ویگور تولید شده است.</p><script>window.onload=()=>setTimeout(()=>window.print(),400)<\/script></html>`);w.document.close()}
function renderData(){let sales=state.sales.reduce((a,x)=>a+num(x.amount),0),exp=state.expenses.reduce((a,x)=>a+num(x.amount),0),leads=state.channels.reduce((a,x)=>a+num(x.leads),0),channelSales=state.channels.reduce((a,x)=>a+num(x.sales),0);main.innerHTML=title('مرکز داده رشد','مرکز ثبت داده‌های مدیریتی؛ فقط اعداد واردشده نمایش داده می‌شوند.')+`<div class="grid">${stat('فروش ثبت‌شده',fmt(sales)+' تومان','از بخش فروش')}${stat('هزینه ثبت‌شده',fmt(exp)+' تومان','از بخش مالی')}${stat('سرنخ‌های کانال‌ها',fmt(leads),'مجموع ورودی ثبت‌شده')}${stat('فروش منتسب به کانال‌ها',fmt(channelSales)+' تومان','بر اساس ثبت دستی')}</div>`+card('مدل داده‌ای سیستم',`<p>داده‌ها در این نسخه در بخش‌های فروش و مشتریان، محصولات، محتوا، هزینه‌ها، عملکرد کانال‌ها، شاخص‌ها و فاکتورها ثبت می‌شوند. اتصال خودکار به WooCommerce، ترب یا شبکه‌های اجتماعی هنوز فعال نیست و به API/اتصال مجزا نیاز دارد.</p><div class="row"><button class="btn secondary" onclick="showPage('channels')">ثبت عملکرد کانال</button><button class="btn secondary" onclick="showPage('sales')">ثبت فروش</button><button class="btn secondary" onclick="showPage('finance')">ثبت هزینه</button><button class="btn secondary" onclick="showPage('kpis')">تعریف شاخص</button></div>`)+card('خروجی داده',`<button class="btn" onclick="exportBackup()">دانلود پشتیبان کامل JSON</button> <button class="btn secondary" onclick="exportCSV()">خروجی CSV فروش</button><p class="muted">برای حفاظت از اطلاعات، پشتیبان را در جای امن نگه دار. حذف داده‌های مرورگر می‌تواند اطلاعات محلی را پاک کند.</p>`)}
function renderChannels(){main.innerHTML=title('سنجش عملکرد کانال‌ها','ماهانه یا هفتگی آمار هر کانال را وارد کن؛ نرخ تبدیل به‌صورت تقریبی محاسبه می‌شود.')+card('ثبت و ویرایش عملکرد',`<div class="table-wrap"><table><thead><tr><th>کانال</th><th>بازدید / دسترسی</th><th>سرنخ</th><th>فروش (تومان)</th><th>هزینه (تومان)</th><th>نرخ سرنخ</th><th>بازده هزینه</th></tr></thead><tbody>${state.channels.map((c,i)=>`<tr><td><input value="${esc(c.name)}" onchange="channelChange(${i},'name',this.value)"></td><td><input type="number" value="${num(c.visits)}" onchange="channelChange(${i},'visits',this.value)"></td><td><input type="number" value="${num(c.leads)}" onchange="channelChange(${i},'leads',this.value)"></td><td><input type="number" value="${num(c.sales)}" onchange="channelChange(${i},'sales',this.value)"></td><td><input type="number" value="${num(c.cost)}" onchange="channelChange(${i},'cost',this.value)"></td><td>${c.visits?fmt((c.leads/c.visits*100).toFixed(1))+'٪':'—'}</td><td>${c.cost?fmt((c.sales/c.cost).toFixed(2))+'×':'—'}</td></tr>`).join('')}</tbody></table></div><button class="btn secondary small" onclick="addChannel()">＋ افزودن کانال</button><p class="muted">آمار دسترسی، سرنخ و فروش باید برای یک بازه زمانی یکسان وارد شود. بازده هزینه، فروش تقسیم بر هزینه است و سود خالص نیست.</p>`)}function channelChange(i,k,v){state.channels[i][k]=k==='name'?v:num(v);save()}function addChannel(){state.channels.push({name:'کانال جدید',visits:0,leads:0,sales:0,cost:0});save();renderChannels()}
function renderKpis(){main.innerHTML=title('شاخص‌ها و اهداف','برای هر هدف مقدار فعلی، مقدار هدف و مهلت ثبت کن؛ داده‌های واقعی را با حدس جایگزین نکن.',`<button class="btn green" onclick="addKpi()">＋ شاخص جدید</button>`)+card('فهرست شاخص‌ها',state.kpis.length?`<div class="table-wrap"><table><thead><tr><th>شاخص</th><th>مقدار فعلی</th><th>هدف</th><th>واحد</th><th>مهلت</th><th>پیشرفت</th><th></th></tr></thead><tbody>${state.kpis.map((k,i)=>`<tr><td>${esc(k.name)}</td><td>${fmt(k.current)}</td><td>${fmt(k.target)}</td><td>${esc(k.unit)}</td><td>${esc(k.due||'—')}</td><td>${k.target?fmt(Math.min(100,k.current/k.target*100).toFixed(0))+'٪':'—'}</td><td><button class="btn small secondary" onclick="editKpi(${i})">ویرایش</button> <button class="btn small red" onclick="deleteKpi(${i})">حذف</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">هنوز شاخصی تعریف نشده. نمونه‌ها: فروش ماهانه، تعداد سفارش، نرخ تبدیل، سود خالص، مشتری جدید و انتشار محتوا.</p>')+card('راهنمای شاخص خوب',`<ul><li>تعریف دقیق و واحد روشن داشته باشد.</li><li>منبع داده و بازه زمانی مشخص باشد.</li><li>مقدار فعلی فقط با داده ثبت‌شده تکمیل شود.</li><li>هدف، مهلت و مسئول پیگیری داشته باشد.</li></ul>`)}function addKpi(){let name=prompt('نام شاخص؟');if(!name)return;let target=num(prompt('مقدار هدف؟','0')),unit=prompt('واحد شاخص؟','تومان')||'';state.kpis.push({name,current:0,target,unit,due:''});save();renderKpis()}function editKpi(i){let k=state.kpis[i];let cur=prompt('مقدار فعلی',k.current);if(cur===null)return;k.current=num(cur);let tar=prompt('مقدار هدف',k.target);if(tar!==null)k.target=num(tar);let due=prompt('مهلت (مثلاً 1405/09/01)',k.due||'');if(due!==null)k.due=due;save();renderKpis()}function deleteKpi(i){if(confirm('شاخص حذف شود؟')){state.kpis.splice(i,1);save();renderKpis()}}
function renderDecisions(){main.innerHTML=title('چرخه تصمیم‌گیری و رشد','از مسئله تا اقدام و یادگیری؛ نتیجه هر تصمیم را ثبت کن.',`<button class="btn green" onclick="addDecision()">＋ ثبت تصمیم</button>`)+card('چرخه پیشنهادی',`<div class="grid">${stat('۱. شناسایی','مسئله','چه اتفاقی افتاده؟')}${stat('۲. فرضیه','علت احتمالی','چه چیزی را تغییر می‌دهیم؟')}${stat('۳. آزمایش','اقدام','چه کسی و تا چه زمانی؟')}${stat('۴. یادگیری','نتیجه','چه چیزی را ادامه/اصلاح می‌کنیم؟')}</div>`)+card('تصمیم‌های ثبت‌شده',state.decisions.length?state.decisions.map((d,i)=>`<div class="card section"><div class="row"><strong>${esc(d.title)}</strong><span class="pill">${esc(d.status)}</span></div><p>${esc(d.problem)}</p><p class="muted">فرضیه: ${esc(d.hypothesis||'—')}</p><p class="muted">اقدام: ${esc(d.action||'—')} · مهلت: ${esc(d.due||'—')}</p><p>نتیجه / یادگیری: ${esc(d.result||'هنوز ثبت نشده')}</p><button class="btn small secondary" onclick="editDecision(${i})">ویرایش</button> <button class="btn small red" onclick="deleteDecision(${i})">حذف</button></div>`).join(''):'<p class="muted">هنوز تصمیمی ثبت نشده است.</p>')}
function addDecision(){let title=prompt('عنوان تصمیم یا مسئله؟');if(!title)return;state.decisions.unshift({title,problem:prompt('مسئله و شواهد؟','')||'',hypothesis:prompt('فرضیه علت؟','')||'',action:prompt('اقدام آزمایشی؟','')||'',due:prompt('مهلت؟','')||'',status:'برای اجرا',result:''});save();renderDecisions()}function editDecision(i){let d=state.decisions[i],r=prompt('نتیجه و یادگیری',d.result||'');if(r!==null)d.result=r;let s=prompt('وضعیت (برای اجرا/در حال اجرا/انجام شد/رد شد)',d.status);if(s!==null)d.status=s;save();renderDecisions()}function deleteDecision(i){if(confirm('حذف شود؟')){state.decisions.splice(i,1);save();renderDecisions()}}
function renderSales(){main.innerHTML=title('فروش و مشتریان','ثبت ساده سرنخ‌ها و فروش‌های انجام‌شده.',`<button class="btn green" onclick="addSale()">＋ ثبت فروش / مشتری</button>`)+card('سوابق فروش',state.sales.length?`<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>مشتری</th><th>محصول / شرح</th><th>مبلغ</th><th>وضعیت</th><th></th></tr></thead><tbody>${state.sales.map((s,i)=>`<tr><td>${esc(s.date)}</td><td>${esc(s.customer)}</td><td>${esc(s.item)}</td><td>${fmt(s.amount)} تومان</td><td>${esc(s.status)}</td><td><button class="btn small red" onclick="deleteSale(${i})">حذف</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">هنوز فروشی ثبت نشده است. فاکتورهای صادرشده نیز در بخش مستقل فاکتور نگهداری می‌شوند.</p>')}
function addSale(){let customer=prompt('نام مشتری؟');if(!customer)return;let item=prompt('محصول یا شرح فروش؟','')||'';let amount=num(prompt('مبلغ فروش به تومان؟','0'));state.sales.unshift({date:new Date().toISOString().slice(0,10),customer,item,amount,status:prompt('وضعیت (سرنخ/در انتظار/فروخته شد)','فروخته شد')||'فروخته شد'});save();renderSales()}function deleteSale(i){if(confirm('رکورد حذف شود؟')){state.sales.splice(i,1);save();renderSales()}}
function renderProducts(){main.innerHTML=title('محصولات و موجودی','فهرست ساده محصولات، قیمت و موجودی برای تصمیم‌گیری بهتر.',`<button class="btn green" onclick="addProduct()">＋ محصول جدید</button>`)+card('فهرست محصولات',state.products.length?`<div class="table-wrap"><table><thead><tr><th>نام محصول</th><th>کد</th><th>موجودی</th><th>قیمت خرید</th><th>قیمت فروش</th><th>حاشیه ناخالص واحد</th><th></th></tr></thead><tbody>${state.products.map((p,i)=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${fmt(p.stock)}</td><td>${fmt(p.buy)}</td><td>${fmt(p.sell)}</td><td>${fmt(num(p.sell)-num(p.buy))} تومان</td><td><button class="btn small red" onclick="deleteProduct(${i})">حذف</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">هنوز محصولی ثبت نشده.</p>')}
function addProduct(){let name=prompt('نام محصول؟');if(!name)return;state.products.push({name,sku:prompt('کد محصول؟','')||'',stock:num(prompt('تعداد موجودی؟','0')),buy:num(prompt('قیمت خرید واحد؟','0')),sell:num(prompt('قیمت فروش واحد؟','0'))});save();renderProducts()}function deleteProduct(i){if(confirm('محصول حذف شود؟')){state.products.splice(i,1);save();renderProducts()}}
function renderContent(){main.innerHTML=title('محتوا و انتشار','بانک ساده محتوای مادر، بازتولید و وضعیت انتشار.',`<button class="btn green" onclick="addContent()">＋ محتوای جدید</button>`)+card('تقویم / بانک محتوا',state.content.length?`<div class="table-wrap"><table><thead><tr><th>عنوان</th><th>محتوای مادر</th><th>کانال</th><th>تاریخ انتشار</th><th>وضعیت</th><th></th></tr></thead><tbody>${state.content.map((c,i)=>`<tr><td>${esc(c.title)}</td><td>${esc(c.pillar||'—')}</td><td>${esc(c.channel)}</td><td>${esc(c.date||'—')}</td><td>${esc(c.status)}</td><td><button class="btn small red" onclick="deleteContent(${i})">حذف</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">هنوز محتوایی ثبت نشده. سناریوی مادر را ثبت و سپس نسخه‌های هر کانال را پیگیری کن.</p>')}
function addContent(){let title=prompt('عنوان محتوا؟');if(!title)return;state.content.unshift({title,pillar:prompt('موضوع/محتوای مادر؟','')||'',channel:prompt('کانال انتشار؟','اینستاگرام')||'',date:prompt('تاریخ انتشار؟','')||'',status:prompt('وضعیت (ایده/در حال تولید/آماده/منتشر شده)','ایده')||'ایده'});save();renderContent()}function deleteContent(i){if(confirm('محتوا حذف شود؟')){state.content.splice(i,1);save();renderContent()}}
function renderFinance(){main.innerHTML=title('مالی و هزینه‌ها','ثبت هزینه‌ها برای تحلیل جریان نقدی و سود تقریبی.',`<button class="btn green" onclick="addExpense()">＋ ثبت هزینه</button>`)+card('هزینه‌های ثبت‌شده',state.expenses.length?`<div class="table-wrap"><table><thead><tr><th>تاریخ</th><th>عنوان</th><th>دسته</th><th>مبلغ</th><th></th></tr></thead><tbody>${state.expenses.map((e,i)=>`<tr><td>${esc(e.date)}</td><td>${esc(e.title)}</td><td>${esc(e.category)}</td><td>${fmt(e.amount)} تومان</td><td><button class="btn small red" onclick="deleteExpense(${i})">حذف</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">هنوز هزینه‌ای ثبت نشده است.</p>')}
function addExpense(){let title=prompt('عنوان هزینه؟');if(!title)return;state.expenses.unshift({date:new Date().toISOString().slice(0,10),title,category:prompt('دسته هزینه؟','عملیاتی')||'عملیاتی',amount:num(prompt('مبلغ به تومان؟','0'))});save();renderFinance()}function deleteExpense(i){if(confirm('هزینه حذف شود؟')){state.expenses.splice(i,1);save();renderFinance()}}
function renderSettings(){let b=state.business;main.innerHTML=title('تنظیمات کسب‌وکار','این اطلاعات در سربرگ فاکتور و گزارش‌ها استفاده می‌شوند.')+card('مشخصات فروشنده / کسب‌وکار',`<div class="row">${field('نام کسب‌وکار','biz-name',b.name)}${field('وب‌سایت','biz-website',b.website)}${field('تلفن','biz-phone',b.phone)}${field('ایمیل','biz-email',b.email)}</div><div class="field"><label>آدرس</label><input id="biz-address" value="${esc(b.address)}"></div><div class="row">${field('شناسه / کد اقتصادی (اختیاری)','biz-taxId',b.taxId)}${field('پیشوند شماره فاکتور','biz-invoicePrefix',b.invoicePrefix)}</div><button class="btn" onclick="saveSettings()">ذخیره تنظیمات</button>`)+card('مدیریت داده و حریم خصوصی',`<p class="muted">اطلاعات در حافظه محلی مرورگر همین دستگاه ذخیره می‌شود. این نسخه همگام‌سازی ابری یا ورود چندکاربره ندارد. برای انتقال اطلاعات از پشتیبان JSON استفاده کن.</p><div class="row"><button class="btn secondary" onclick="exportBackup()">دانلود پشتیبان</button><button class="btn secondary" onclick="document.getElementById('restoreFile').click()">بازیابی پشتیبان</button><button class="btn red" onclick="resetData()">پاک‌کردن همه داده‌ها</button></div>`)}function saveSettings(){let b=state.business;b.name=document.getElementById('biz-name').value;b.website=document.getElementById('biz-website').value;b.phone=document.getElementById('biz-phone').value;b.email=document.getElementById('biz-email').value;b.address=document.getElementById('biz-address').value;b.taxId=document.getElementById('biz-taxId').value;b.invoicePrefix=document.getElementById('biz-invoicePrefix').value;save();renderSettings();alert('تنظیمات ذخیره شد.')}
function exportBackup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='electro-vigor-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.steps||!d.business)throw Error();if(confirm('اطلاعات فعلی با پشتیبان جایگزین شود؟')){state=d;save();render();alert('بازیابی انجام شد.')}}catch(err){alert('فایل پشتیبان معتبر نیست.')}e.target.value=''};r.readAsText(f)}function exportCSV(){let rows=[['date','customer','item','amount','status'],...state.sales.map(s=>[s.date,s.customer,s.item,s.amount,s.status])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='electro-vigor-sales.csv';a.click();URL.revokeObjectURL(a.href)}function resetData(){if(confirm('هشدار: همه اطلاعات محلی حذف می‌شوند. ابتدا پشتیبان بگیر. ادامه می‌دهی؟')){localStorage.removeItem('ev-control-v2');state=JSON.parse(JSON.stringify(defaultState));save();showPage('dashboard')}}
if('serviceWorker'in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}render();
</script></body></html>
